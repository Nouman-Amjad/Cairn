{{/*
Schema migration as a pre-sync hook.

Forward-only and expand-contract, and no migration may hold a lock on
trajectory_steps: add nullable, backfill in a job, tighten in a later release.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: cairn-migrate-{{ .Values.global.image.tag | replace "." "-" | replace "_" "-" | trunc 20 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: cairn-orchestrator
      securityContext:
        {{- include "cairn.podSecurity" . | nindent 8 }}
      containers:
        - name: alembic
          image: {{ .Values.global.image.registry }}/cairn-orchestrator:{{ .Values.global.image.tag }}
          command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
          securityContext:
            {{- include "cairn.containerSecurity" . | nindent 12 }}
          env:
            - name: CAIRN_DB_DSN
              valueFrom: { secretKeyRef: { name: cairn-database, key: dsn } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
