{{/*
External Secrets Operator against AWS Secrets Manager.

Each SecretStore is namespaced to the service account that needs it via IRSA,
so the Anthropic key is readable by cairn-router and by nothing else.
*/}}
{{- range $secret, $spec := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ $secret }}
    creationPolicy: Owner
  data:
    {{- range $key, $remote := $spec }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- end }}
