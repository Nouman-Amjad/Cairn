apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cairn
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    {{- end }}
    # SSE streams are long-lived; the default 60s idle timeout would cut an
    # investigation off mid-answer.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cairn-gateway
                port: { number: 8000 }
          # Slack's webhook. Signature-verified inside the service; the path
          # is public because Slack has no static egress range worth pinning.
          - path: /slack/interactions
            pathType: Exact
            backend:
              service:
                name: cairn-approval
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cairn-ui
                port: { number: 3000 }
