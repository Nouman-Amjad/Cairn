[project]
name = "cairn-orchestrator"
version = "0.1.0"
description = "Cairn's agent loop: a state machine persisted to Postgres"
requires-python = ">=3.12"
dependencies = [
    "cairn-core",
    "cairn-router",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "mcp>=1.2",
    "redis>=5.2",
    "prometheus-client>=0.21",
]

[project.scripts]
cairn-orchestrator = "cairn_orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_orchestrator"]

[tool.uv.sources]
cairn-core = { workspace = true }
cairn-router = { workspace = true }
