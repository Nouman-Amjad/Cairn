id: inc-011
title: Connection pool exhaustion after a deploy raised concurrency (payments-api)
archetype: resource_exhaustion
solvable: true
question: why did payments-api latency spike at 03:06?
ground_truth:
  root_cause: The 03:02 deploy of payments-api raised request concurrency without raising maxPoolSize,
    so the DB connection pool saturated and requests queued behind a 30s acquire timeout.
  causal_service: payments-api
  contributing_deploy: 9f2c1ab4de11
  required_evidence:
  - metric: checkout_db_pool_wait_seconds
  - log_pattern: 'TimeoutError: QueuePool limit'
  - event: 9f2c1ab4de11
distractors:
- unrelated frontend deploy at 02:45
- correlated but non-causal CPU spike on payments-api
