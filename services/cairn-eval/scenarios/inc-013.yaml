id: inc-013
title: Feature flag change with no deploy (search-api)
archetype: config_change
solvable: true
question: error rate for search-api jumped at 03:20 and there was no deploy — why?
ground_truth:
  root_cause: A config reload enabled the 'new_pricing' feature flag at 03:19, which exercised a null-unsafe
    path in PricingResolver. No code was deployed; the change arrived through configuration.
  causal_service: search-api
  contributing_deploy: null
  required_evidence:
  - log_pattern: config reload
  - log_pattern: NullPointerException in PricingResolver
  - metric: http_requests_total
distractors:
- an inventory-api deploy at 02:10 outside the window
- a coincident increase in request volume
