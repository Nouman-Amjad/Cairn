id: inc-017
title: Kafka consumer group thrashing (payments-api)
archetype: queue_backlog
solvable: true
question: payments-api is lagging badly since 02:50
ground_truth:
  root_cause: The payments-api consumer group is stuck in a rebalance loop. Partitions are reassigned
    faster than they can be processed, so committed offsets stall and lag grows without bound.
  causal_service: payments-api
  contributing_deploy: null
  required_evidence:
  - metric: kafka_consumergroup_lag
  - log_pattern: NoBrokersAvailable
  - event: consumer_rebalance
distractors:
- a producer-side volume increase that is within normal range
- an unrelated broker restart the previous day
