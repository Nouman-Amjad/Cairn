id: inc-003
title: Memory leak producing OOMKills between restarts
archetype: memory_leak_oom
solvable: true
question: search-api keeps restarting since about 02:40, why?
ground_truth:
  root_cause: 'A memory leak in search-api: the working set climbs steadily between restarts until it
    crosses the container limit and the kubelet OOMKills the pod. Not a burst — the sawtooth is monotonic.'
  causal_service: search-api
  contributing_deploy: null
  required_evidence:
  - metric: container_memory_working_set_bytes
  - log_pattern: OutOfMemoryError
  - event: oom_kill
distractors:
- a routine deploy six days ago
- elevated GC time on cart-service
