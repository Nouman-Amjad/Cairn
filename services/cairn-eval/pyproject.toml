[project]
name = "cairn-eval"
version = "0.1.0"
description = "Synthetic incident suite and CI gate for Cairn"
requires-python = ">=3.12"
dependencies = [
    "cairn-core",
    "cairn-orchestrator",
    "cairn-mcp-kit",
    "cairn-router",
]

[project.scripts]
cairn-eval = "cairn_eval.runner:main"
cairn-eval-gate = "cairn_eval.gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_eval"]

[tool.uv.sources]
cairn-core = { workspace = true }
cairn-orchestrator = { workspace = true }
cairn-mcp-kit = { workspace = true }
cairn-router = { workspace = true }
