[project]
name = "cairn-router"
version = "0.1.0"
description = "Cost-and-sensitivity model router for Cairn"
requires-python = ">=3.12"
dependencies = [
    "cairn-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "anthropic>=0.42",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
    "watchfiles>=1.0",
]

[project.scripts]
cairn-router = "cairn_router.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_router"]

[tool.uv.sources]
cairn-core = { workspace = true }
