[project]
name = "cairn-mcp-actions"
version = "0.1.0"
description = "MCP server for Cairn's approval-gated write actions"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Cairn contributors" }]
keywords = ["mcp", "observability", "incident-response", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]


dependencies = [
    "cairn-core",
    "cairn-mcp-kit",
    "cairn-approval",
    "httpx>=0.28",
]

[project.scripts]
cairn-mcp-actions = "cairn_mcp_actions.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_mcp_actions"]

[tool.uv.sources]
cairn-core = { workspace = true }
cairn-mcp-kit = { workspace = true }
cairn-approval = { workspace = true }

[project.urls]
Homepage = "https://github.com/Nouman-Amjad/cairn"
Source = "https://github.com/Nouman-Amjad/cairn"
