[project]
name = "cairn-approval"
version = "0.1.0"
description = "Durable approval state machine and Slack gate for Cairn write actions"
requires-python = ">=3.12"
dependencies = [
    "cairn-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "prometheus-client>=0.21",
]

[project.scripts]
cairn-approval = "cairn_approval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_approval"]

[tool.uv.sources]
cairn-core = { workspace = true }
