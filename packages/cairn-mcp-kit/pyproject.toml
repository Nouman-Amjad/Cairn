[project]
name = "cairn-mcp-kit"
version = "0.1.0"
description = "Shared scaffolding for Cairn MCP servers: auth, policy, result capping"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Cairn contributors" }]
keywords = ["mcp", "observability", "incident-response", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]


dependencies = [
    "cairn-core",
    "mcp>=1.2,<2.0",
    "starlette>=0.41",
    "uvicorn[standard]>=0.34",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_mcp_kit"]

[tool.uv.sources]
cairn-core = { workspace = true }

[project.urls]
Homepage = "https://github.com/Nouman-Amjad/cairn"
Source = "https://github.com/Nouman-Amjad/cairn"
